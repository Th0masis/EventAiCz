name: Slides checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slides-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Slides validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Slides

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Slides/package-lock.json

      - run: npm ci
      - run: npm run test:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > preview.log 2>&1 &
      - run: SLIDES_URL=http://127.0.0.1:4173 npm run test:smoke

      - name: Upload rendered slides and preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-slides
          path: |
            Slides/artifacts/slides/
            Slides/preview.log
          if-no-files-found: warn